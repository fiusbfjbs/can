name: Build Canvas EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name canvas `
            --collect-submodules kivy `
            --collect-data kivy `
            --collect-binaries kivy `
            --hidden-import kivy `
            --hidden-import kivy.app `
            --hidden-import kivy.uix.widget `
            --hidden-import kivy.core.window `
            --hidden-import kivy.graphics `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-exe
          path: dist/canvas.exe

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Canvas Rainbow v${{ github.run_number }}
          files: dist/canvas.exe
          generate_release_notes: true
